site_name: RCAN Docs
site_url: https://docs.rcan.dev
site_description: RCAN protocol specification — sections, appendices, profiles.
site_author: Craig Merry
repo_name: craigm26/rcan-docs
repo_url: https://github.com/craigm26/rcan-docs
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Spec:
    - Overview: spec/index.md
    - "§1 Robot URI (RURI)": spec/section-1.md
    - "§2 Role-Based Access Control": spec/section-2.md
    - "§3 Message Format": spec/section-3.md
    - "§4 Discovery (mDNS)": spec/section-4.md
    - "§5 Authentication": spec/section-5.md
    - "§6 Safety Invariants": spec/section-6.md
    - "§7 Federation": spec/section-7.md
    - "§8 Robot Config (RCAN File)": spec/section-8.md
    - "§9 Capabilities": spec/section-9.md
    - "§10 Autonomous Navigation": spec/section-10.md
    - "§11 Behavior Scripts": spec/section-11.md
    - "§12 Depth & Sensing": spec/section-12.md
    - "§13 Telemetry Streaming": spec/section-13.md
    - "§14 Provider Management": spec/section-14.md
    - "§15 Swarm Coordination": spec/section-15.md
    - "§16 AI Accountability": spec/section-16.md
    - "§17 Distributed Registry Node Protocol": spec/section-17.md
    - "§18 Capability Advertisement Protocol": spec/section-18.md
    - "§19 Behavior/Skill Invocation Protocol": spec/section-19.md
    - "§20 Telemetry Field Registry": spec/section-20.md
    - "§21 Robot Registry Integration": spec/section-21.md
    - "§22 FRIA Protocol": spec/section-22.md
    - "§23 Safety Benchmark Protocol": spec/section-23.md
    - "§24 Instructions for Use": spec/section-24.md
    - "§25 Post-Market Monitoring": spec/section-25.md
    - "§26 EU Register Submission": spec/section-26.md
    - "§27 FRIA Protocol": spec/section-27.md
  - Appendix:
    - "B: WebSocket Transport Binding": spec/appendix-b.md
  - Authority: spec/authority.md
  - Competitions: spec/competitions.md
  - Credits: spec/credits.md
  - Firmware: spec/firmware.md
  - SBOM: spec/sbom.md
  - Bridges:
    - OPC UA: bridges/opcua-bridge.md
    - ROS 2: bridges/ros2-bridge.md
  - Compliance:
    - EU AI Act: compliance/eu-ai-act.md
    - EU AI Act Mapping: compliance/eu-ai-act-mapping.md
    - Article 9 Risk Assessment Template: compliance/art9-risk-assessment-template.md
    - Article 13 Transparency Template: compliance/art13-transparency-template.md
    - Article 17 QMS Template: compliance/art17-qms-template.md
    - Conformity Assessment Template: compliance/conformity-assessment-template.md
    - RCAN Compliance Statement Template: compliance/rcan-compliance-statement-template.md
    - IEC 62443 Alignment: compliance/iec-62443-alignment.md
    - ISO 10218 Alignment: compliance/iso-10218-alignment.md
    - NIST AI RMF Alignment: compliance/nist-ai-rmf-alignment.md
    - SIL/PLe Declarations: compliance/sil-ple-declarations.md
  - Crypto:
    - PQC Profile: crypto/pqc-profile.md
  - Federation:
    - Federation Protocol: federation/federation-protocol.md
  - Verification:
    - Manufacturer Verification: verification/manufacturer-verification.md
  - Governance:
    - Robot Registry Foundation: governance/robot-registry-foundation.md
  - Engagement:
    - ISO TC299 Roadmap: engagement/iso-tc299-roadmap.md
  - Whitepaper:
    - AI Accountability Layer 2026: whitepaper/ai-accountability-layer-2026.md
  - Reference:
    - Robot Memory Schema: reference/robot-memory-schema.md

# Per-site nav added during migration phases.

# mike versioning — enables version selector in the header.
# Versioned deploys land in Task 25; until then, non-versioned deploys
# from main publish under "latest" alias.
extra:
  version:
    provider: mike
    default: stable
