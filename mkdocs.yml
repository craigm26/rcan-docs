site_name: RCAN Docs
site_url: https://docs.rcan.dev
site_description: RCAN protocol specification — sections, appendices, profiles.
site_author: Craig Merry
repo_name: craigm26/rcan-docs
repo_url: https://github.com/craigm26/rcan-docs
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Spec:
    - Overview: spec/index.md
    - Section 1 — Robot URI (RURI): spec/section-1.md
    - Section 2 — Role-Based Access Control: spec/section-2.md
    - Section 3 — Message Format: spec/section-3.md
    - Section 4 — Discovery (mDNS): spec/section-4.md
    - Section 5 — Authentication: spec/section-5.md
    - Section 6 — Safety Invariants: spec/section-6.md
    - Section 7 — Federation: spec/section-7.md
    - Section 8 — Robot Config (RCAN File): spec/section-8.md
    - Section 9 — Capabilities: spec/section-9.md
    - Section 10 — Autonomous Navigation: spec/section-10.md
    - Section 11 — Behavior Scripts: spec/section-11.md
    - Section 12 — Depth & Sensing: spec/section-12.md
    - Section 13 — Telemetry Streaming: spec/section-13.md
    - Section 14 — Provider Management: spec/section-14.md
    - Section 15 — Swarm Coordination: spec/section-15.md
    - Section 16 — AI Accountability: spec/section-16.md
    - Section 17 — Distributed Registry Node Protocol: spec/section-17.md
    - Section 18 — Capability Advertisement Protocol: spec/section-18.md
    - Section 19 — Behavior/Skill Invocation Protocol: spec/section-19.md
    - Section 20 — Telemetry Field Registry: spec/section-20.md
    - Section 21 — Robot Registry Integration: spec/section-21.md
    - Section 22 — Fundamental Rights Impact Assessment: spec/section-22.md
    - Section 23 — Safety Benchmark Protocol: spec/section-23.md
    - Section 24 — Instructions for Use: spec/section-24.md
    - Section 25 — Post-Market Monitoring: spec/section-25.md
    - Section 26 — EU Register Submission: spec/section-26.md
    - Section 27 — FRIA Protocol: spec/section-27.md
    - Appendix B — WebSocket Transport Binding: spec/appendix-b.md
    - Authority: spec/authority.md
    - Competitions: spec/competitions.md
    - Credits: spec/credits.md
    - Firmware: spec/firmware.md
    - SBOM: spec/sbom.md

# Per-site nav added during migration phases.

# mike versioning — enables version selector in the header.
# Versioned deploys land in Task 25; until then, non-versioned deploys
# from main publish under "latest" alias.
extra:
  version:
    provider: mike
    default: stable
